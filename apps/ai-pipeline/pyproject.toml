[project]
name = "ai-pipeline"
version = "0.1.0"
description = "AI and Ingestion Pipeline for ai-job-matching-engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7.0",
    "instructor>=1.3.0",
    "ollama>=0.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
